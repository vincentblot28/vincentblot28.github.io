- title: Professional Experience
  type: time_table
  contents:
    - title: Data Scientist / Consultant
      institution: Quantmetry – Capgemini Invent, Paris, France
      year: Oct. 2020 – Present
      description:
        - title: Small fiber neuropathy detection in skin biopsy images
          contents:
            - Assisted diagnosis using computer vision; developed algorithms to support neurologists on histopathology.
            - Co-inventor of a medical diagnostic device (Patent Application No. 22 00588).
            - Retrospective and prospective clinical trials (ongoing) to assess performance and clinical relevance.
        - title: Development of the <a href="https://github.com/scikit-learn-contrib/MAPIE">MAPIE</a> library (conformal prediction)
          contents:
            - Focus on multiclass and multilabel tasks.
            - Presentations at DFUQ workshop @ ICML 2022 and COPA 2023.
        - title: Work conducted during the PhD
          contents:
            - <b>Adaptive recall control for semantic segmentation:</b> Methodology with formal recall guarantees (binary segmentation); dynamic, image-dependent thresholding to boost precision while meeting target recall.
            - <b>Uncertainty quantification for follicle detection in mouse ovaries:</b> Integrated biological priors (size distributions, spatial structure) to improve UQ reliability; precision-control mechanism for medical imaging tools.
            - <b>Conformal prediction for Gaussian Processes (regression):</b> Novel cross-conformal approach improving interval adaptability; theoretical insights with coverage guarantees robust to non-Gaussian data.

